<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <link rel="icon" href="images/icon.webp" type="image/webp" sizes="16x16">
    <title>404 Page Not Found - Stackly</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="">
    <meta name="keywords" content="">
    <meta name="author" content="">

    <!-- CSS Files
    ================================================== -->
    <link rel="stylesheet" href="css/bootstrap.css" type="text/css">
    <link rel="stylesheet" href="css/plugins.css" type="text/css">
    <link rel="stylesheet" href="css/style.css" type="text/css">
    <link rel="stylesheet" href="css/coloring.css" type="text/css">

    <!-- css for scheme color -->
    <link rel="stylesheet" href="css/cream.css" type="text/css" id="colors">

    <!-- custom css -->
    <link rel="stylesheet" href="css/03_custom.css" type="text/css">

    <style>
        .wow {
            visibility: visible !important;
        }

        body.page-404 {
            margin: 0;
            background-color: #141416;
            overflow-x: hidden;
        }

        #section-404 {
            position: relative;
            min-height: 100vh;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 48px 20px;
            background:
                radial-gradient(circle at 50% 25%, rgba(227, 192, 134, 0.14), transparent 52%),
                radial-gradient(circle at 50% 85%, rgba(196, 131, 73, 0.12), transparent 50%),
                #141416;
        }

        .error-404-card {
            position: relative;
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            padding: 52px 42px;
            text-align: center;
            border-radius: 18px;
            border: 1px solid rgba(227, 192, 134, 0.28);
            background: linear-gradient(165deg, rgba(255, 255, 255, 0.05) 0%, rgba(255, 255, 255, 0.015) 100%);
            box-shadow: 0 28px 80px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            overflow: hidden;
        }

        .error-404-card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 16%;
            right: 16%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #e3c086, #c48349, transparent);
        }

        .error-404-brand {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 22px;
        }

        .error-404-logo {
            height: 36px;
            width: auto;
            display: block;
        }

        .error-404-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 16px;
            margin-bottom: 18px;
            border-radius: 999px;
            border: 1px solid rgba(227, 192, 134, 0.35);
            background: rgba(227, 192, 134, 0.08);
            color: var(--primary-color);
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 1.6px;
            text-transform: uppercase;
        }

        .error-404-code {
            font-family: var(--title-font);
            font-size: clamp(86px, 14vw, 138px);
            font-weight: 700;
            line-height: 0.95;
            letter-spacing: 4px;
            margin: 0 auto 16px auto;
            background: linear-gradient(135deg, #f6deb3 0%, #e3c086 48%, #c48349 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 12px 26px rgba(196, 131, 73, 0.22));
        }

        .error-404-divider {
            width: 64px;
            height: 2px;
            margin: 0 auto 22px auto;
            border-radius: 2px;
            background: linear-gradient(90deg, transparent, var(--primary-color), transparent);
        }

        .error-404-card h2 {
            color: #ffffff;
            font-size: 28px;
            line-height: 1.3;
            margin-bottom: 14px;
        }

        .error-404-card p {
            color: var(--body-font-color-dark);
            font-size: 15px;
            line-height: 1.75;
            max-width: 440px;
            margin: 0 auto 30px auto;
        }

        .error-404-actions {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .btn-404-primary {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 13px 30px;
            border-radius: 999px;
            background: linear-gradient(135deg, #e3c086 0%, #c48349 100%);
            color: #1f1712 !important;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            text-decoration: none;
            box-shadow: 0 10px 24px rgba(196, 131, 73, 0.28);
            transition: transform 0.22s ease, box-shadow 0.22s ease, filter 0.22s ease;
        }

        .btn-404-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 30px rgba(196, 131, 73, 0.38);
            filter: brightness(1.06);
        }

        .btn-404-ghost {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 24px;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.22);
            background: rgba(255, 255, 255, 0.03);
            color: #ffffff !important;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            text-decoration: none;
            transition: border-color 0.22s ease, background-color 0.22s ease, color 0.22s ease;
        }

        .btn-404-ghost:hover {
            border-color: var(--primary-color);
            background: rgba(227, 192, 134, 0.1);
            color: var(--primary-color) !important;
        }

        @media only screen and (max-width: 600px) {
            .error-404-card {
                padding: 38px 24px;
                border-radius: 14px;
            }

            .error-404-card h2 {
                font-size: 24px;
            }

            .error-404-actions {
                flex-direction: column;
                width: 100%;
            }

            .btn-404-primary,
            .btn-404-ghost {
                width: 100%;
            }
        }
    </style>
</head>

<body class="dark-scheme page-404">

    <div id="wrapper">

        <div id="content" class="no-bottom no-top">

            <section id="section-404">
                <div class="error-404-card">
                    <a href="index.html" class="error-404-brand">
                        <img src="images/logo.webp" alt="Stackly" class="error-404-logo">
                    </a>
                    <div>
                        <span class="error-404-badge"><i class="fa fa-compass"></i> Error 404</span>
                    </div>
                    <div class="error-404-code">404</div>
                    <div class="error-404-divider"></div>
                    <h2>Page Not Found</h2>
                    <p>The page or feature you requested isn't available right now. Return home to continue exploring.</p>
                    <div class="error-404-actions">
                        <a href="index.html" class="btn-404-primary">Return to Home <i class="fa fa-home"></i></a>
                        <a href="dashboard.html" id="btn404Dashboard" class="btn-404-ghost"><i class="fa fa-th-large"></i> Return to Dashboard</a>
                    </div>
                </div>
            </section>

        </div>

        <div id="preloader">
            <div class="preloader1"></div>
        </div>
    </div>

    <!-- Javascript Files
    ================================================== -->
    <script src="js/plugins.js"></script>
    <script src="js/designesia.js"></script>
    <script>
        jQuery(function ($) {
            var dashBtn = $('#btn404Dashboard');
            function updateDashLink() {
                var user = window.StacklyAuth ? window.StacklyAuth.getUser() : null;
                dashBtn.attr('href', user ? 'dashboard.html' : 'login.html');
            }
            updateDashLink();
            dashBtn.on('click', function (e) {
                var user = window.StacklyAuth ? window.StacklyAuth.getUser() : null;
                if (!user) {
                    e.preventDefault();
                    window.location.href = 'login.html';
                }
            });
        });
    </script>

</body>

</html>
